<title>PO101 Study Guide</title>
<style>

main{max-width:1100px;margin:0 auto;padding:20px}

.big{font-size:42px;font-weight:bold}
.narrow{max-width:820px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));grid-auto-rows:130px;grid-auto-flow:dense;gap:10px;margin-top:14px}

.t.f .in{transform:rotateY(180deg)}
.t.long{grid-column:span 2;grid-row:span 2}
.t .face{padding:12px 14px;border-top-width:4px}
.t .back{font-size:13px;line-height:1.4}
.mwrap{display:grid;grid-template-columns:1fr 290px;gap:16px;margin-top:12px;align-items:start}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.m.term{font-weight:bold;border-top:4px solid var(--navy)}
.m.def{border-top:4px solid var(--gold);font-size:13px}
.side{position:sticky;top:8px;max-height:85vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--ok);border-radius:6px;padding:12px 14px;font:13px/1.4 Arial,sans-serif}

.mg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:8px;max-height:78vh;overflow:auto;padding-right:4px}
.col h4{position:sticky;top:0;margin:0;padding:6px 0;background:var(--bg);font:600 13px Arial,sans-serif;color:var(--blue);letter-spacing:.05em;text-transform:uppercase}
@media (max-width:520px){.mg2{grid-template-columns:1fr}.col{max-height:42vh}}
#hb{float:right;color:#fff;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:12px;font-size:12px;letter-spacing:0}
#sbar{margin-bottom:14px}
#find{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:15px Arial,sans-serif}
mark{background:#bfe5cb;color:#12351f;padding:0 2px;border-radius:2px}
.opt.gone{opacity:.35;text-decoration:line-through}
.m.hint{box-shadow:0 0 0 3px var(--gold);background:#fff3d1;color:#1c2430}
</style>

["15","mc","The Federal Reserve System is best described as:",["a central bank managing US monetary policy, interest rates, and inflation","a Treasury agency that writes the federal budget","a congressional committee that sets appropriations","an executive agency that collects taxes"],"The Fed is the central bank."],
["15","tf","According to your study guide, Kevin Warsh serves as Chair of the Federal Reserve, succeeding Jerome Powell in May 2026.",true,"True per the first study guide."],

["B","mc","Sherman says US interest-rate increases affect other economies mainly by:",["strengthening the dollar, raising the cost of dollar-denominated debt, and pushing foreign central banks toward rate hikes","weakening the dollar and cheapening imports worldwide","lowering the cost of dollar-denominated loans","freezing capital flows into the United States"],"A stronger dollar also makes imported goods and energy more expensive."],
["B","mc","In Brown’s comparison, which country offers the most housing assistance and which the most social assistance?",["UK housing; Denmark social assistance","Denmark housing; UK social assistance","US housing; Denmark social assistance","UK housing; US social assistance"],"Brown concludes US benefits are less generous with stricter eligibility."],
["B","mc","Carbone explains why people abroad fear climate change more than Americans mainly by citing:",["greater direct environmental vulnerability and less partisan polarization over climate science","stronger economies that can absorb regulation","less media coverage abroad","a belief that climate science is unsettled"],"US political divisions hinder consensus on environmental risk."]
];
const PB=[
"In your reading “Jeremy B. Merrill. 2016. ‘Liberal, Moderate or Conservative? See How Facebook Labels You.’ The New York Times,” describe the methodology that the social media site uses to label its users. Do you agree or disagree with this methodology to identify the political ideologies of users of Facebook? How does this methodology contrast with the one used in IDEALog?",
"In your reading “David Leonhardt. 2022. ‘A Crisis Coming: The Twin Threats to American Democracy.’ The New York Times,” what are the “twin threats to American Democracy” identified by Leonhardt? Describe both threats and discuss two factors that Leonhardt identifies as the causes of the threats.",
"In your reading “Gregory J. Carbone. 2017. ‘Why People Around the World Fear Climate Change More than Americans Do.’ The Conversation,” why do people around the world fear climate change more than Americans do? What are some of the effects of this difference for environmental, economic, and other policies?",
"In your reading “Natalie Sherman. 2022. ‘Global Inflation: Five Ways US Rate Rise will Affect You.’ BBC,” list and discuss three (3) of the “ways” Sherman argues US rate increases will affect you.",
"According to the data provided in your reading “Taylor Kate Brown. 2016. ‘How US Welfare Compares around the Globe.’ BBC,” what country offers the most social assistance as welfare benefits? What country offers the most housing benefits as welfare assistance? What is the conclusion of the author in terms of whether US welfare is better or worse than other comparable countries?",
"In your reading “Brandon Drenon and Nadine Yousif. 2025. ‘What are the Key Items in Trump’s Sprawling Budget Bill?’ BBC,” list and discuss whether the key items in the bill fall under mandatory or discretionary spending. Discuss two ideological implications and justifications for any two items in the bill.",
"In your reading “Jessie Williams, Sarah Habershon, & Becky Dale. 2022. ‘Arabs Believe Economy is Weak Under Democracy.’ BBC,” list and discuss three findings from the survey discussed in the reading that support the claim that “Arabs are losing faith in democracy to deliver economic stability across the Middle East and North Africa.”",
"In your reading “Rachel Nuwer. 2018. ‘Why Governments are Broken and How to Fix Them,’” discuss the reasons that are advanced to support the claim that governments are broken. What is the proposed fix?",
"In your reading “Ashita Nagesh. 2022. ‘Nationality and Borders Bill: Can you lose your citizenship?’ BBC,” what is the answer to the question of whether someone could lose their citizenship? Describe the answer(s) to the question using the evidence provided in the reading for three separate countries."
];
const $=s=>document.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let MT=null,H=5,qry="",mode="cards",on=new Set(Object.keys(SECTIONS));
const hb=()=>{$("#hb").textContent="Hints left: "+H+" / 5"};
const useHint=()=>{if(H<1)return false;H--;hb();return true};
const hw=(t,n)=>t.split(/\s+/).slice(0,n).join(" ")+"…";
const STOP=new Set("a an the of and or to in on for by with as is are be that this it its their his her from at than which who whom while when into over under about between not no but so such can may also each any all was were been has have had".split(" "));
const clean=w=>w.toLowerCase().replace(/[^a-z0-9]/g,"");
const stem=w=>w.length>3&&w.endsWith("s")&&!w.endsWith("ss")?w.slice(0,-1):w;
const keyw=t=>t.split(/\s+/).map(clean).filter(w=>w&&!STOP.has(w)).map(stem);
const mark=(t,set)=>t.split(/(\s+)/).map(p=>{const c=clean(p);return c&&!STOP.has(c)&&set.has(stem(c))?`<mark>${esc(p)}</mark>`:esc(p)}).join("");
const pool=()=>D.filter(d=>on.has(d[0]));
const found=()=>pool().filter(d=>!qry||(d[1]+" "+d[2]).toLowerCase().includes(qry));
const MODES={cards:"Flashcards",tiles:"Tile wall",quiz:"Part A quiz",partb:"Part B essays",match:"Matching",type:"Type it"};
$("#nav").innerHTML=Object.entries(MODES).map(([k,v])=>`<button data-m="${k}">${v}</button>`).join("");
$("#chips").innerHTML=[["all","Select all"],["none","Clear"],...Object.entries(SECTIONS)].map(([k,v])=>`<button data-s="${k}">${v}</button>`).join("");
$("#nav").onclick=e=>{if(e.target.dataset.m){mode=e.target.dataset.m;go()}};
$("#chips").onclick=e=>{const k=e.target.dataset.s;if(!k)return;if(k==="all")on=new Set(Object.keys(SECTIONS));else if(k==="none")on=new Set();else on.has(k)?on.delete(k):on.add(k);go()};
$("#find").oninput=e=>{qry=e.target.value.trim().toLowerCase();go()};
function go(){
 clearInterval(MT);$("#app").onclick=null;$("#app").onkeydown=null;$("#app").className=(mode==="tiles"||mode==="match")?"":"narrow";$("#sbar").hidden=!(mode==="cards"||mode==="tiles");hb();$("#chips").style.display=mode==="partb"?"none":"";
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
 document.querySelectorAll("#chips button").forEach(b=>b.classList.toggle("on",on.has(b.dataset.s)));
 const n=mode==="partb"?1:(mode==="cards"||mode==="tiles")?found().length:pool().length;
 if(!n){$("#app").innerHTML=`<div class="panel">No cards to show. Select at least one chapter${qry?" or clear the search":""}.</div>`;return}
 ({cards,tiles,quiz,partb,match,type})[mode]();
}
/* FLASHCARDS (known / still learning, auto-advance) */
function cards(){
 const base=found();let deck=qry?base:sh(base),i=0,flipped=false,yes=[],no=[],shown=new Set();
 const draw=()=>{
  if(i>=deck.length){
   $("#app").innerHTML=`<div class="panel"><div class="big">${yes.length} known · ${no.length} still learning</div>
   <div class="row"><button class="btn" id="rv" ${no.length?"":"hidden"}>Review the ${no.length} I missed</button><button class="btn alt" id="rs">Start over</button></div></div>`;
   $("#rv").onclick=()=>{deck=sh(no);no=[];yes=[];i=0;flipped=false;draw()};
   $("#rs").onclick=cards;return}
  const c=deck[i];
  $("#app").innerHTML=`<div class="meta">Card ${i+1} of ${deck.length} · Known ${yes.length} · Still learning ${no.length}</div>
  <div class="flip ${flipped?"f":""}" id="fl" tabindex="0" role="button" aria-label="Flip card"><div class="in">
   <div class="face"><div class="tag">${SECTIONS[c[0]]}</div><div class="term">${esc(c[1])}</div><div class="hint" id="hx">${shown.has(c)?"Hint: starts “"+hw(c[2],3)+"”":"Click to reveal definition"}</div></div>
   <div class="face back"><div class="tag">${esc(c[1])}</div><div class="def">${esc(c[2])}</div></div></div></div>
  <div class="row"><button class="btn bad" id="no">Still learning</button><button class="btn ok" id="yes">Known</button><button class="btn alt" id="ht" ${H?"":"disabled"}>Hint (${H} left)</button>
  <button class="btn alt" id="sf">Shuffle</button></div>`;
  const fl=$("#fl");const tg=()=>{flipped=!flipped;fl.classList.toggle("f",flipped)};
  fl.onclick=tg;fl.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();tg()}};
  const nx=a=>{a.push(c);i++;flipped=false;draw()};
  $("#ht").onclick=()=>{if(!shown.has(c)){if(!useHint())return;shown.add(c)}$("#hx").textContent="Hint: starts “"+hw(c[2],3)+"”";$("#ht").textContent=`Hint (${H} left)`;if(!H)$("#ht").disabled=true;flipped=false;fl.classList.remove("f")};
  $("#no").onclick=()=>nx(no);$("#yes").onclick=()=>nx(yes);
  $("#sf").onclick=()=>{deck=sh(deck);i=0;yes=[];no=[];flipped=false;draw()};
 };draw();
}
/* TILE WALL */
function tiles(){
 let d=qry?found():sh(found());
 const draw=()=>{
  $("#app").innerHTML=`<div class="row" style="margin:0"><span class="meta">${d.length} tiles · click any tile to flip it</span><button class="btn alt" id="fa">Flip all</button><button class="btn alt" id="rs">Flip all back</button><button class="btn alt" id="sf">Shuffle</button></div>
  <div class="tiles">${d.map(c=>`<div class="t ${c[2].length>190?"long":""}" tabindex="0" role="button" aria-label="Flip tile"><div class="in"><div class="face"><div class="tag">${SECTIONS[c[0]]}</div><div class="term" style="font-size:16px">${esc(c[1])}</div></div><div class="face back"><div class="def" style="font-size:13px">${esc(c[2])}</div></div></div></div>`).join("")}</div>`;
  const all=()=>document.querySelectorAll(".t");
  $("#app").onclick=e=>{const t=e.target.closest(".t");if(t)t.classList.toggle("f")};
  $("#app").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){const t=e.target.closest(".t");if(t){e.preventDefault();t.classList.toggle("f")}}};
  $("#fa").onclick=()=>all().forEach(t=>t.classList.add("f"));
  $("#rs").onclick=()=>all().forEach(t=>t.classList.remove("f"));
  $("#sf").onclick=()=>{d=sh(d);draw()};
 };draw();
}
/* PART A QUIZ: 30 questions, 2 pts each, multiple choice + true/false */
function quiz(){
 const bank=QB.filter(x=>on.has(x[0]));
 if(!bank.length){$("#app").innerHTML=`<div class="panel">No Part A questions in the selected chapters.</div>`;return}
 const qs=sh(bank).slice(0,30);let i=0,score=0,miss=[];
 const draw=()=>{
  if(i>=qs.length){
   $("#app").innerHTML=`<div class="panel"><div class="big">${score*2} / ${qs.length*2} points</div><p>${score} of ${qs.length} correct.</p>${miss.length?"<h4>Review what you missed</h4>"+miss.map(m=>`<p><b>${esc(m[2])}</b><br><span class="meta">${esc(m[4])}</span></p>`).join(""):""}<button class="btn" id="re">New exam</button></div>`;
   $("#re").onclick=quiz;return}
  const q=qs[i],tf=q[1]==="tf";
  const opts=tf?[{t:"True",ok:q[3]===true},{t:"False",ok:q[3]===false}]:sh(q[3].map((t,k)=>({t,ok:k===0})));
  $("#app").innerHTML=`<div class="meta">Question ${i+1} of ${qs.length} · ${score*2} pts so far · ${tf?"True / False":"Multiple choice"} · 2 pts</div>
  <div class="panel"><div class="def">${esc(q[2])}</div><div id="o">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div>
  <div id="fb" class="meta" style="margin-top:10px"></div>
  <div class="row">${tf?"":`<button class="btn alt" id="ht" ${H?"":"disabled"}>Hint (${H} left)</button>`}<button class="btn" id="nq" hidden>${i+1<qs.length?"Next":"See results"}</button></div></div>`;
  if(!tf)$("#ht").onclick=()=>{if(!useHint())return;const xs=document.querySelectorAll(".opt");sh(opts.map((o,k)=>k).filter(k=>!opts[k].ok)).slice(0,2).forEach(k=>{xs[k].disabled=true;xs[k].classList.add("gone")});$("#ht").disabled=true;$("#ht").textContent="Hint used"};
  $("#o").onclick=e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;
   const ok=opts[b.dataset.k].ok;if(ok)score++;else miss.push(q);
   document.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add("right")});
   if(!ok)b.classList.add("wrong");
   $("#fb").textContent=q[4];const h=$("#ht");if(h)h.disabled=true;
   $("#nq").hidden=false;$("#nq").focus();$("#nq").onclick=()=>{i++;draw()}};
 };draw();
}
/* PART B ESSAYS: full prompts */
function partb(){
 let ids=PB.map((_,k)=>k);
 function list(){
  $("#app").innerHTML=`<div class="row" style="margin:0 0 12px"><span class="meta">${ids.length} prompts shown. On the exam you answer 4 of 6 in three sentences or less, 10 pts each.</span><button class="btn alt" id="dr">Draw 6 random</button><button class="btn alt" id="al">Show all 9</button></div>
  ${ids.map(k=>`<div class="panel" style="margin-bottom:12px"><div class="tag">Question ${k+1}</div><div class="def">${esc(PB[k])}</div><div class="row"><button class="btn" data-i="${k}">Answer this</button></div></div>`).join("")}`;
  $("#dr").onclick=()=>{ids=sh(PB.map((_,k)=>k)).slice(0,6).sort((a,b)=>a-b);list()};
  $("#al").onclick=()=>{ids=PB.map((_,k)=>k);list()};
  $("#app").onclick=e=>{const b=e.target.closest("[data-i]");if(b)ans(+b.dataset.i)};
 }
 function ans(k){
  const ref=D.find(d=>d[0]==="B"&&d[1].startsWith("Q"+(k+1)+":"))[2];
  $("#app").onclick=null;
  $("#app").innerHTML=`<div class="panel"><div class="tag">Part B · Question ${k+1}</div><div class="def">${esc(PB[k])}</div>
  <textarea id="ans" placeholder="Answer in three sentences or less…"></textarea>
  <div class="row"><span class="meta" id="sc">Sentences: 0 / 3</span><button class="btn" id="sb">Submit</button><button class="btn alt" id="bk">Back to questions</button></div><div id="out"></div></div>`;
  $("#ans").oninput=()=>{const n=($("#ans").value.match(/[^.!?]+(?:[.!?]+|$)/g)||[]).filter(x=>x.trim()).length;$("#sc").textContent=`Sentences: ${n} / 3`;$("#sc").style.color=n>3?"var(--bad)":""};
  $("#bk").onclick=list;
  $("#sb").onclick=()=>{
   const raw=$("#ans").value.trim(),a=raw||"(no answer)";$("#ans").disabled=true;$("#sb").hidden=true;
   const dk=new Set(keyw(ref)),ak=new Set(keyw(raw)),hit=new Set([...dk].filter(w=>ak.has(w))),pct=dk.size?Math.round(100*hit.size/dk.size):0;
   $("#out").innerHTML=`<div class="cmp"><p class="big" style="margin:0">${pct}%</p><p class="meta" style="margin:0">${hit.size} of ${dk.size} key words from the study-guide summary appeared in your answer</p>
   <h4>Study-guide summary (words you matched highlighted)</h4><div class="real">${mark(ref,hit)}</div>
   <h4>What you said (matching words highlighted)</h4><div>${mark(a,hit)}</div></div>
   <p class="meta">Questions that ask for your opinion (like Q1) also need your own reasoning, which the percentage cannot score.</p>`};
 }
 list();
}
/* MATCHING (all tiles at once, stopwatch, matches move to the side) */
function match(){
 const src=pool().filter(d=>d[2].length<150);
 if(src.length<2){$("#app").innerHTML=`<div class="panel">Pick a section with short definitions (Part B readings are too long for matching).</div>`;return}
 const T=[...sh(src.map(d=>({k:d[1],t:d[1],c:"term"}))),...sh(src.map(d=>({k:d[1],t:d[2],c:"def"})))];
 let sel=null,done=0,tries=0,t0=0;
 const fmt=ms=>{const s=ms/1000;return Math.floor(s/60)+":"+(s%60).toFixed(1).padStart(4,"0")};
 $("#app").innerHTML=`<div class="row" style="margin:0 0 4px"><div class="clock" id="ck">0:00.0</div><span class="meta" id="st">Click a term, then its definition. Stopwatch starts on your first click · ${src.length} pairs</span><button class="btn alt" id="ht" ${H?"":"disabled"}>Hint (${H} left)</button><button class="btn alt" id="ag">New round</button></div>
 <div class="mwrap"><div class="mg2" id="mg">${["term","def"].map(c=>`<div class="col"><h4>${c==="term"?"Terms":"Definitions"}</h4>${T.map((x,j)=>x.c===c?`<button class="m ${c}" data-j="${j}">${esc(x.t)}</button>`:"").join("")}</div>`).join("")}</div>
 <div class="side"><strong>Matched <span id="mc">0</span> / ${src.length}</strong><div id="sd"></div></div></div>`;
 $("#ag").onclick=go;
 $("#ht").onclick=()=>{const ms=[...document.querySelectorAll(".m")];if(!ms.length||!useHint())return;const ks=[...new Set(ms.map(x=>T[x.dataset.j].k))];const k=sel?T[sel.dataset.j].k:ks[Math.floor(Math.random()*ks.length)];
  ms.forEach(x=>{if(T[x.dataset.j].k===k){x.classList.add("hint");setTimeout(()=>x.classList.remove("hint"),2500)}});$("#ht").textContent=`Hint (${H} left)`;if(!H)$("#ht").disabled=true};
 $("#mg").onclick=e=>{const b=e.target.closest(".m");if(!b)return;
  if(!t0){t0=Date.now();MT=setInterval(()=>{$("#ck").textContent=fmt(Date.now()-t0)},100)}
  if(!sel){sel=b;b.classList.add("sel");return}
  if(sel===b){b.classList.remove("sel");sel=null;return}
  const A=T[sel.dataset.j],B=T[b.dataset.j];if(A.c===B.c){sel.classList.remove("sel");sel=b;b.classList.add("sel");return}tries++;
  if(A.k===B.k&&A.c!==B.c){
   const tm=A.c==="term"?A:B,df=A.c==="def"?A:B;
   sel.remove();b.remove();sel=null;done++;
   $("#sd").insertAdjacentHTML("afterbegin",`<div><b>${esc(tm.t)}</b><br>${esc(df.t)}</div>`);
   $("#mc").textContent=done;
   if(done===src.length){clearInterval(MT);const f=fmt(Date.now()-t0);$("#ck").textContent=f;$("#st").textContent=`Finished in ${f} with ${tries} attempts.`}
  }else{
   [sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("no");setTimeout(()=>x.classList.remove("no"),400)});sel=null}
 };
}
/* TYPED RESPONSE (word-match highlighting + percent) */
function type(){
 const qs=sh(pool());let i=0,got=0,seen=0;
 const draw=()=>{
  if(i>=qs.length){$("#app").innerHTML=`<div class="panel"><div class="big">${got} / ${seen}</div><p>Marked correct. Round complete.</p><button class="btn" id="re">Go again</button></div>`;$("#re").onclick=type;return}
  const q=qs[i];let hinted=false;
  $("#app").innerHTML=`<div class="meta">Term ${i+1} of ${qs.length} · Self-scored: ${got} / ${seen}</div>
  <div class="panel"><div class="tag">Define this from memory</div><div class="term">${esc(q[1])}</div>
  <textarea id="ans" placeholder="Type your definition…"></textarea>
  <div class="row"><button class="btn" id="sb">Submit</button><button class="btn alt" id="ht" ${H?"":"disabled"}>Hint (${H} left)</button></div>
  <div id="hx" class="meta" style="margin-top:8px"></div><div id="out"></div></div>`;
  $("#ht").onclick=()=>{if(!hinted){if(!useHint())return;hinted=true}$("#hx").textContent="Hint: the definition starts “"+hw(q[2],4)+"”";$("#ht").textContent=`Hint (${H} left)`;if(!H)$("#ht").disabled=true};
  $("#sb").onclick=()=>{
   const raw=$("#ans").value.trim(),a=raw||"(no answer)";$("#ans").disabled=true;$("#sb").hidden=true;$("#ht").hidden=true;
   const dk=new Set(keyw(q[2])),ak=new Set(keyw(raw)),hit=new Set([...dk].filter(w=>ak.has(w))),pct=dk.size?Math.round(100*hit.size/dk.size):0;
   $("#out").innerHTML=`<div class="cmp"><p class="big" style="margin:0">${pct}%</p><p class="meta" style="margin:0">${hit.size} of ${dk.size} key words from the definition appeared in your answer</p>
   <h4>Term</h4><div>${esc(q[1])}</div><h4>Real definition (words you matched highlighted)</h4><div class="real">${mark(q[2],hit)}</div>
   <h4>What you said (matching words highlighted)</h4><div>${mark(a,hit)}</div></div>
   <div class="row"><span class="meta">Did you get it?</span><button class="btn ok" id="y">Got it</button><button class="btn bad" id="n">Missed it</button></div>`;
   const nx=r=>{seen++;if(r)got++;i++;draw()};$("#y").onclick=()=>nx(1);$("#n").onclick=()=>nx(0)};
 };draw();
}
go();
</script>
